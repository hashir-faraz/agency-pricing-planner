<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content KPI Dashboard — Sports Media Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7F5; --surface:#FFFFFF; --ink:#121814; --ink-soft:#48534C; --ink-faint:#8CA095;
  --line:#E2E9E4; --accent:#0CA678; --accent-soft:#E6F7F0; --accent-deep:#087F5B;
  --warn:#E8A13C; --bad:#E05B4F;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);padding:22px clamp(16px,3vw,40px) 60px}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif}
.hero{background:var(--accent);border-radius:22px;padding:clamp(26px,4vw,44px) clamp(24px,4vw,48px);color:#fff;margin-bottom:26px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em}
.hero p{margin-top:8px;font-size:14px;opacity:.92;max-width:600px;line-height:1.55}
.hero .pill{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);border-radius:99px;padding:9px 16px;font:600 12.5px 'Inter',sans-serif;align-self:flex-start}
.max{max-width:1360px;margin:0 auto}

.plats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
.plat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.plat h3{font-size:12.5px;font-weight:700;margin-bottom:10px}
.ring{width:78px;height:78px;margin:0 auto 8px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 15px 'Plus Jakarta Sans',sans-serif}
.plat i{font-style:normal;font-size:10.5px;color:var(--ink-faint)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.panel h4{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--ink-faint);margin-bottom:14px}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 14px;font:600 12px 'Inter',sans-serif;color:var(--ink-soft);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.trow{display:grid;grid-template-columns:minmax(170px,220px) 1fr 110px;gap:14px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:none}
.trow .nm{font-size:13px;font-weight:600}
.trow .nm i{font-style:normal;display:block;font-size:10.5px;color:var(--ink-faint);font-weight:500;margin-top:2px}
.track{height:12px;border-radius:6px;background:#E9F0EB;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;transition:width .5s}
.trow .st{font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:700;text-align:right}
.trow .st i{font-style:normal;display:block;font-size:10.5px;color:var(--ink-faint);font-weight:500}
@media(max-width:1080px){.plats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.plats{grid-template-columns:repeat(2,1fr)}.trow{grid-template-columns:minmax(120px,150px) 1fr 84px}}
</style>
</head>
<body>
<div class="max">
<div class="hero">
  <div>
    <h1>Content KPI Dashboard</h1>
    <p>Monthly publishing targets vs actuals for a sports media brand — thirteen content series across six platforms, tracked to a single completion score.</p>
  </div>
  <span class="pill" id="asof">Month to date</span>
</div>

<div class="plats" id="plats"></div>

<div class="panel">
  <h4>Content Series Progress</h4>
  <p class="sub">Combined across all platforms. Filter by pillar.</p>
  <div class="chips" id="chips"></div>
  <div id="rows"></div>
</div>
</div>

<script>
const P=['YouTube','Instagram','TikTok','X','Facebook','Website'];
const D=[
 {p:'Flagship Show',s:'Weekly Flagship Episode',v:[[1,1],[5,3],[15,9],[6,2],[4,1],[1,1]]},
 {p:'Flagship Show',s:'Episode Clips & Shorts',v:[[15,8],[15,11],[15,12],[15,6],[8,3],[0,0]]},
 {p:'Thematic Programming',s:'Rivalries Series',v:[[4,2],[10,5],[3,3],[4,2],[3,1],[1,0]]},
 {p:'Thematic Programming',s:'Collabs & Guest Features',v:[[2,1],[2,2],[5,2],[2,1],[2,0],[0,0]]},
 {p:'Thematic Programming',s:'Editorial Explainers',v:[[1,0],[4,2],[4,1],[1,1],[2,1],[2,1]]},
 {p:'Thematic Programming',s:'Legends & Archive',v:[[1,1],[3,1],[6,2],[1,0],[2,1],[1,0]]},
 {p:'Fundamentals',s:'Matchday Stats & Graphics',v:[[0,0],[8,6],[6,4],[12,9],[6,3],[0,0]]},
 {p:'Fundamentals',s:'Goal / Play of the Week',v:[[4,3],[4,4],[4,3],[4,2],[4,2],[0,0]]},
 {p:'Fundamentals',s:'Fixtures & Results',v:[[0,0],[4,4],[0,0],[8,7],[4,4],[4,3]]},
 {p:'Fundamentals',s:'Team of the Week',v:[[0,0],[4,2],[4,1],[4,3],[4,1],[0,0]]},
 {p:'Editorial',s:'Viral Memes & Hot Topics',v:[[0,0],[7,5],[7,6],[7,4],[7,2],[0,0]]},
 {p:'Editorial',s:'Site Articles with Call-Out',v:[[0,0],[2,1],[0,0],[4,2],[2,1],[6,4]]},
 {p:'Editorial',s:'Hype & Countdown Posts',v:[[1,1],[1,1],[1,1],[1,0],[1,1],[0,0]]},
];
const pillars=['All',...new Set(D.map(x=>x.p))];
let sel='All';

function col(pct){return pct>=0.8?'var(--accent)':pct>=0.5?'var(--warn)':'var(--bad)'}

function render(){
  // platform rings
  document.getElementById('plats').innerHTML=P.map((p,i)=>{
    let t=0,d=0; D.forEach(x=>{t+=x.v[i][0];d+=x.v[i][1]});
    const pct=t?d/t:0, C=2*Math.PI*33;
    return `<div class="plat"><h3>${p}</h3>
      <div class="ring"><svg width="78" height="78"><circle cx="39" cy="39" r="33" stroke="#E9F0EB" stroke-width="9" fill="none"/>
      <circle cx="39" cy="39" r="33" stroke="${col(pct)}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}"/></svg>
      <b>${Math.round(pct*100)}%</b></div>
      <i>${d} of ${t} posts</i></div>`;
  }).join('');
  // chips
  document.getElementById('chips').innerHTML=pillars.map(p=>`<span class="chip ${sel===p?'on':''}" onclick="sel='${p}';render()">${p}</span>`).join('');
  // rows
  const rows=D.filter(x=>sel==='All'||x.p===sel).map(x=>{
    const t=x.v.reduce((a,v)=>a+v[0],0), d=x.v.reduce((a,v)=>a+v[1],0);
    const pct=t?d/t:0;
    return `<div class="trow">
      <span class="nm">${x.s}<i>${x.p}</i></span>
      <span class="track"><i style="width:${Math.max(3,pct*100)}%;background:${col(pct)}"></i></span>
      <span class="st">${Math.round(pct*100)}%<i>${d} / ${t} posts</i></span>
    </div>`;
  }).join('');
  document.getElementById('rows').innerHTML=rows;
}
render();
</script>
</body>
</html>
